name: verification
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install BLAS/LAPACK and Python packages
        run: |
          sudo apt-get update && sudo apt-get install -y liblapack3 libblas3
          pip install -r requirements.txt
      - name: v2 verification (V1-V5)
        env:
          DEVSIM_MATH_LIBS: /usr/lib/x86_64-linux-gnu/liblapack.so.3:/usr/lib/x86_64-linux-gnu/libblas.so.3
        run: cd src_v2 && python verification.py
      - name: v3 verification (V1-V9)
        env:
          DEVSIM_MATH_LIBS: /usr/lib/x86_64-linux-gnu/liblapack.so.3:/usr/lib/x86_64-linux-gnu/libblas.so.3
        run: cd src_v3 && python verification.py && python check_verification.py
